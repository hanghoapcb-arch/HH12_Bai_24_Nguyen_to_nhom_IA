<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thí nghiệm 3D: Li, Na, K tác dụng với nước, chlorine, oxygen</title>
<style>
:root{--bg:#0d1520;--p:#13202f;--p2:#1a2b40;--ln:#27405c;--tx:#e8eef6;--mu:#92a6bd;--ac:#35c2a1;--a2:#f0a04b;--bd:#ef6a6a;--ok:#4cd08a;--lw:246px;--rw:330px}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px "Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit;font-size:13px;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
/* thanh trên */
#top{position:fixed;left:0;right:0;top:0;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:rgba(10,18,28,.92);border-bottom:1px solid var(--ln);z-index:7;gap:8px}
#top .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:14px}
#top .grp{display:flex;gap:6px;align-items:center;flex-shrink:0}
#top input{background:#08111b;border:1px solid var(--ln);color:#fff;border-radius:8px;padding:4px 8px;width:140px;font-size:13px}
.sc{background:var(--p2);border:1px solid var(--ln);padding:2px 10px;border-radius:16px;white-space:nowrap;font-size:12.5px}.sc b{color:var(--ac)}
.tg{background:var(--p2);border:1px solid var(--ln);color:var(--mu);border-radius:8px;padding:4px 9px;font-size:12.5px;white-space:nowrap}
.tg.on{border-color:var(--ac);color:var(--ac)}.tg:hover{border-color:var(--ac)}
/* bảng hai bên */
.pn{position:fixed;background:rgba(19,32,47,.94);border:1px solid var(--ln);border-radius:12px;display:flex;flex-direction:column;min-height:0;z-index:5;transition:transform .25s,opacity .25s}
.ph{display:flex;justify-content:space-between;align-items:center;padding:5px 6px 5px 10px;border-bottom:1px solid var(--ln);font-weight:700;font-size:13px;gap:6px}
.ph button{padding:1px 8px}
#lp{left:10px;top:50px;width:226px;max-height:calc(100vh - 124px)}
#rp{right:10px;top:50px;width:310px;max-height:calc(100vh - 124px)}
#lp.hid{transform:translateX(-120%);opacity:0;pointer-events:none}#rp.hid{transform:translateX(120%);opacity:0;pointer-events:none}
.hdl{position:fixed;top:56px;z-index:6;display:none;background:rgba(19,32,47,.94);border:1px solid var(--ln);color:var(--ac);padding:8px 7px;font-size:15px}
#hl{left:0;border-radius:0 10px 10px 0;border-left:0}#hr{right:0;border-radius:10px 0 0 10px;border-right:0}
.body{overflow-y:auto;padding:7px 8px;min-height:0;flex:1}
.stp{border:1px solid var(--ln);border-radius:8px;background:#101d2c;padding:5px 8px;margin-bottom:5px;display:flex;gap:7px;align-items:center;cursor:pointer;font-size:12.8px;line-height:1.3}
.stp .si{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mu);display:grid;place-items:center;font-size:11px;flex:none;color:var(--mu)}
.stp.done .si{background:var(--ok);border-color:var(--ok);color:#04231b}.stp.cur{border-color:var(--ac)}.stp.cur .si{border-color:var(--ac);color:var(--ac)}.stp.lock{opacity:.5}.stp.view{background:#16384a}
.tabs{display:flex;border-bottom:1px solid var(--ln)}.tabs button{flex:1;background:none;border:0;color:var(--mu);padding:6px 2px;border-bottom:2px solid transparent;font-size:12.5px}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:700}
/* thẻ thuyết minh */
#info{position:fixed;top:50px;left:calc(var(--lw) + (100vw - var(--lw) - var(--rw))/2);transform:translateX(-50%);width:min(540px,calc(100vw - var(--lw) - var(--rw) - 24px));min-width:240px;background:rgba(19,32,47,.94);border:1px solid var(--ln);border-radius:12px;z-index:5;font-size:12.8px;transition:left .25s,width .25s}
#info.hid{display:none}
#info .ih{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px}
#info .ih b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
#info .ic{padding:1px 8px}
#info .ib{padding:7px 12px 9px;max-height:28vh;overflow-y:auto;line-height:1.55;color:#c9d6e5;border-top:1px solid var(--ln)}
#info.col .ib{display:none}
.eq{margin:5px 0;padding:5px 8px;background:#08111b;border-radius:6px;font-family:Cambria,"Times New Roman",serif;font-size:13.5px;color:#ffe3a8}
.tk{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--ln);border-radius:8px;margin-bottom:5px;background:#101d2c;font-size:12.8px}
.tk i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mu);display:grid;place-items:center;font-style:normal;flex:none;font-size:11px}
.tk.ok{border-color:var(--ok)}.tk.ok i{background:var(--ok);border-color:var(--ok);color:#04231b}
.q{border:1px solid var(--ln);border-radius:10px;background:#101d2c;padding:8px;margin-bottom:8px}.q.okq{border-color:var(--ok)}.q.nq{border-color:var(--bd)}
.qh{font-size:11.5px;margin-bottom:3px;color:var(--ac);font-weight:700}.qt{line-height:1.45;margin-bottom:5px;font-size:13px}
.opt{display:block;width:100%;text-align:left;margin:3px 0;background:#0f1b2a;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:5px 8px;line-height:1.35;font-size:12.8px}
.opt:hover:not(:disabled){border-color:var(--ac)}.opt.ok{border-color:var(--ok);background:#12362a}.opt.bad{border-color:var(--bd);background:#3a1a1a}
.ex{margin-top:5px;padding:5px 8px;border-radius:7px;font-size:12.3px;line-height:1.5}.ex.g{background:#12362a;color:#bdf0d3}.ex.r{background:#3a1c1c;color:#ffc9c9}
.tfi{border:1px solid var(--ln);border-radius:8px;padding:6px 8px;margin:5px 0;background:#0f1b2a}.tfi.ok{border-color:var(--ok)}.tfi.bad{border-color:var(--bd)}
.tft{line-height:1.4;margin-bottom:5px;font-size:12.8px}.tfb{display:flex;gap:6px}.tfb button{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:3px 14px}
.tfb button.sel{background:var(--ac);color:#03241b;border-color:var(--ac);font-weight:700}.tfb button:disabled{cursor:default}
.tfc{margin-top:6px}.qh .ty{color:var(--mu);font-weight:400;margin-left:6px}
.btn{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px 11px}
.btn:hover:not(:disabled){border-color:var(--ac)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#03241b;font-weight:700}.btn.warn{border-color:var(--a2);color:var(--a2)}.btn.on{border-color:var(--ac);color:var(--ac)}
#ctrl{position:fixed;left:10px;right:10px;bottom:10px;min-height:46px;background:rgba(19,32,47,.94);border:1px solid var(--ln);border-radius:12px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:5}
#ctrl .sp{flex:1}
#eqb{position:fixed;left:50%;bottom:68px;transform:translateX(-50%);display:none;background:rgba(10,18,28,.94);border:1px solid var(--a2);border-radius:10px;padding:5px 14px;font-family:Cambria,"Times New Roman",serif;font-size:14px;color:#ffe3a8;z-index:5;text-align:center;line-height:1.55}
#toast{position:fixed;left:50%;top:100px;transform:translateX(-50%);background:#0a121c;border:1px solid var(--a2);color:#ffe3a8;padding:7px 14px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;font-size:13px;z-index:9}
#nogl{position:fixed;left:20%;right:20%;top:45%;text-align:center;color:var(--a2);padding:12px;background:#0a121c;border:1px solid var(--ln);border-radius:10px;z-index:4}
.rs input{background:#08111b;border:1px solid var(--ln);color:#fff;border-radius:8px;padding:6px 9px;width:100%;margin:4px 0 8px}
.hi{border:1px solid var(--ln);border-radius:8px;padding:5px 8px;margin:5px 0;font-size:12.3px;background:#0f1b2a}
pre{white-space:pre-wrap;background:#08111b;padding:8px;border-radius:8px;font-size:12.3px;margin:6px 0}
@media(max-width:900px){#top input{width:100px}#top .ttl{display:none}#top{justify-content:flex-end}}
</style></head>
<body>
<canvas id="cv"></canvas>
<div id="top"><div class="ttl">Thí nghiệm 3D: Li, Na, K tác dụng với nước, chlorine, oxygen</div>
<div class="grp"><input id="stu" placeholder="Họ tên học sinh" maxlength="40">
<span class="sc" id="ckw" style="display:none">Đun: <b id="ck">0</b> phút</span><span class="sc" id="mc" style="display:none"></span><span class="sc">Điểm <b id="sc">0</b>/<span id="mx">16</span></span>
<button class="tg on" id="tgl" title="Ẩn/hiện bảng các bước">☰ Các bước</button><button class="tg on" id="tgi" title="Ẩn/hiện thuyết minh">ⓘ Thuyết minh</button><button class="tg on" id="tgr" title="Ẩn/hiện bảng học tập">📚 Học tập</button><button class="tg" id="tga" title="Ẩn hoặc khôi phục toàn bộ bảng">⛶ Toàn cảnh</button></div></div>
<div id="lp" class="pn"><div class="ph"><span>Các bước</span><button class="btn" id="tl" title="Ẩn bảng">✕</button></div><div class="body" id="stl"></div></div>
<div id="rp" class="pn"><div class="ph"><span>Học tập</span><button class="btn" id="tr" title="Ẩn bảng">✕</button></div>
<div class="tabs"><button data-t="tk" class="on">Nhiệm vụ</button><button data-t="qz">Câu hỏi</button><button data-t="rs">Kết quả</button></div>
<div class="body" id="rb"></div></div>
<div id="info"><div class="ih"><b id="it"></b><button class="btn ic" id="ic" title="Thu gọn / mở rộng">▾</button><button class="btn ic" id="ix" title="Ẩn thuyết minh">✕</button></div><div class="ib" id="ibd"></div></div>
<button class="hdl" id="hl" title="Hiện bảng các bước">☰</button><button class="hdl" id="hr" title="Hiện bảng học tập">📚</button>
<div id="eqb"></div>
<div id="ctrl"></div>
<div id="toast"></div><div id="nogl" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const fp=n=>String(Math.round(n*100)/100).replace('.',',');
const KEY='ddhoa-li-na-k-v1',HKEY='ddhoa-li-na-k-hist',UKEY='ddhoa-li-na-k-ui';
let HAS3D=false,booted=false,tm=0,tab='tk',showL=true;

const STEPS=[
{t:'Chuẩn bị',d:'<b>Thí nghiệm:</b> lithium (Li), sodium (Na), potassium (K) tác dụng với nước, chlorine, oxygen. Sách mô tả ba thí nghiệm đã được thực hiện và quan sát; mô phỏng này dựng lại các hiện tượng đó.<br><b>Hoá chất:</b> kim loại Li, Na, K; nước.<br><b>Dụng cụ:</b> 3 bình tam giác đựng khí oxygen, 3 bình tam giác đựng khí chlorine, 3 chậu thuỷ tinh, muỗng sắt, dao, kẹp sắt (cùng đèn cồn cho TN2, TN3).<br><b>An toàn:</b> Li, Na, K phản ứng mạnh với nước nên chỉ lấy mẫu rất nhỏ bằng kẹp sắt, không cầm tay; chlorine là khí độc, chỉ làm ở nơi thoáng khí hoặc tủ hút; đeo kính, găng tay, khẩu trang.'},
{t:'TN1: Cho Li, Na, K vào nước',d:'Cho mỗi mẫu kim loại vào một chậu thuỷ tinh chứa nước (Bảng 24.3 của sách). Hiện tượng: <b>Li:</b> mẫu chuyển động chậm trên mặt nước. <b>Na:</b> mẫu trở thành khối cầu, chạy nhanh trên mặt nước. <b>K:</b> mẫu cháy, kèm tiếng nổ nhẹ. Cả ba đều sinh bọt khí H₂.<div class="eq">2M + 2H₂O → 2MOH + H₂↑   (M = Li, Na, K)</div>'},
{t:'TN1: So sánh và nhận biết môi trường',d:'<b>Yêu cầu 1:</b> mức độ phản ứng của kim loại với nước tăng dần từ Li đến K (Li chậm nhất, K mạnh nhất).<br><b>Yêu cầu 2:</b> phương trình hoá học của các phản ứng:<div class="eq">2Li + 2H₂O → 2LiOH + H₂↑</div><div class="eq">2Na + 2H₂O → 2NaOH + H₂↑</div><div class="eq">2K + 2H₂O → 2KOH + H₂↑</div><b>Nhận biết môi trường:</b> nhỏ phenolphthalein vào dung dịch thu được thì dung dịch chuyển hồng (hoặc quỳ tím hoá xanh, giấy pH có pH > 7): dung dịch có môi trường base vì tạo LiOH, NaOH, KOH.'},
{t:'TN2: Tác dụng với chlorine',d:'Cho mỗi mẫu Li, Na, K vào muỗng sắt, hơ nóng trên ngọn lửa đèn cồn đến khi nóng chảy, rồi đưa nhanh vào bình đựng khí chlorine. Hiện tượng (theo sách): các kim loại bốc cháy với mức độ tăng dần từ Li đến K.<div class="eq">2Li + Cl₂ →(t°) 2LiCl</div><div class="eq">2Na + Cl₂ →(t°) 2NaCl</div><div class="eq">2K + Cl₂ →(t°) 2KCl</div><i>Màu ngọn lửa (Li đỏ thẫm, Na vàng cam, K tím nhạt) và khói trắng của muối chloride là phần bổ sung trong mô phỏng, sách chỉ nêu mức độ cháy.</i>'},
{t:'TN3: Tác dụng với oxygen',d:'Cho mỗi mẫu Li, Na, K vào muỗng sắt, hơ nóng trên ngọn lửa đèn cồn đến khi nóng chảy rồi đưa nhanh vào lọ đựng khí oxygen. Hiện tượng (theo sách): các kim loại bốc cháy với mức độ tăng dần từ Li đến K.<div class="eq">4Li + O₂ →(t°) 2Li₂O</div><div class="eq">4Na + O₂ →(t°) 2Na₂O</div><div class="eq">4K + O₂ →(t°) 2K₂O</div><i>Đây là phương trình theo chương trình phổ thông; thực tế Na, K còn có thể tạo thêm peroxide khi dư oxygen.</i>'},
{t:'Mô hình nguyên tử: vì sao tăng dần?',d:'Camera chuyển sang cảnh mô hình, bấm “Chạy phản ứng”. Ba nguyên tử Li (2,1), Na (2,8,1), K (2,8,8,1) đều có 1 electron ở lớp ngoài cùng. Từ Li đến K số lớp electron tăng nên bán kính tăng, electron ngoài cùng ở xa hạt nhân hơn, càng dễ bị tách ra. Mỗi nguyên tử nhường 1 electron tạo ion M⁺ (nhỏ hơn nguyên tử) nên Li < Na < K về mức độ phản ứng. Mô hình chỉ minh hoạ, không đúng tỉ lệ bán kính thật và không mô tả quỹ đạo thật của electron.'},
{t:'Giải thích và kết luận',d:'<b>Kết luận:</b> Li, Na, K đều là kim loại hoạt động mạnh: tác dụng với nước tạo dung dịch base và khí H₂; cháy trong chlorine và oxygen khi đun nóng. Mức độ phản ứng tăng dần từ Li đến K.<br><b>Bản chất:</b> kim loại nhường 1 electron (M → M⁺ + e), là chất khử; số oxi hoá 0 → +1.<br><b>Lỗi thường gặp:</b> mẫu quá lớn gây nổ mạnh, bắn nước kiềm; mẫu còn dầu hoặc ẩm làm hiện tượng sai khác; đưa muỗng vào bình quá chậm khi mẫu đã nguội thì phản ứng yếu.'}
];
const TASKS=[
 {t:'Cho Li, Na, K vào 3 chậu nước và quan sát',k:'a'},
 {t:'So sánh mức độ phản ứng của Li, Na, K với nước',k:'b'},
 {t:'Nhận biết môi trường base bằng phenolphthalein',k:'c'},
 {t:'Cho cả 3 mẫu cháy trong bình khí chlorine',k:'d'},
 {t:'Cho cả 3 mẫu cháy trong bình khí oxygen',k:'e'},
 {t:'Chạy mô hình nhường electron của Li, Na, K',k:'f'},
 {t:'Hoàn thành giải thích và kết luận',k:'g'}
];
const QZ=[
 {t:'mc',q:'Khi cho mẫu Li vào chậu nước, hiện tượng quan sát được là:',o:['Mẫu kim loại chuyển động chậm trên mặt nước.','Mẫu kim loại chạy nhanh thành khối cầu.','Mẫu kim loại cháy, kèm tiếng nổ nhẹ.','Mẫu kim loại chìm xuống đáy chậu.'],a:0,x:'Theo Bảng 24.3, Li chuyển động chậm trên mặt nước.'},
 {t:'mc',q:'Khi cho mẫu Na vào chậu nước, hiện tượng quan sát được là:',o:['Mẫu trở thành khối cầu, chạy nhanh trên mặt nước.','Mẫu đứng yên ở mép chậu.','Mẫu cháy, kèm tiếng nổ nhẹ.','Mẫu tan ngay không có khí.'],a:0,x:'Na nóng chảy thành khối cầu và chạy nhanh trên mặt nước.'},
 {t:'mc',q:'Khi cho mẫu K vào chậu nước, hiện tượng quan sát được là:',o:['Mẫu kim loại cháy, kèm tiếng nổ nhẹ.','Mẫu chuyển động chậm.','Mẫu chuyển thành khối cầu rồi chìm.','Không có hiện tượng gì.'],a:0,x:'K phản ứng mạnh nhất: cháy và có tiếng nổ nhẹ.'},
 {t:'mc',q:'Mức độ phản ứng của Li, Na, K với nước tăng dần theo thứ tự:',o:['Li < Na < K','K < Na < Li','Na < Li < K','Li = Na = K'],a:0,x:'Từ Li đến K mức độ phản ứng tăng dần.'},
 {t:'mc',q:'Sản phẩm của phản ứng giữa Na và nước là:',o:['NaOH và H₂','Na₂O và H₂','NaOH và O₂','NaH và O₂'],a:0,x:'2Na + 2H₂O → 2NaOH + H₂↑.'},

 flameA.material.color.setHex(FCOL[ci]);flameA.material.emissive.setHex(FCOL[ci]);flameL.position.set(FX[ci],1.8,FZ[ck]);flameL.intensity=flameG.visible?fi*7:0;

function updMol(dt){
 if(ST.rxPlay){ST.rx=clamp(ST.rx+dt/7,0,1);

 MOL.atoms.forEach((o,j)=>{const u=ease(clamp((ST.rx-o.delay)/.45,0,1));
  o.ag.scale.setScalar(lerp(1,.82,u));

  o.els.forEach(e=>{const a=e.a0+tm*e.sp;let r=e.r,sc=1;
   if(e.outer){r=lerp(e.r,o.R0+3.4,u);sc=lerp(1,.8,u);}
   e.m.position.set(Math.cos(a)*r,Math.sin(a)*r,Math.sin(a)*r*.22*(e.k%2?1:-1));e.m.scale.setScalar(sc);});
  const L=MOL.labs[j];L.nm.visible=showL&&u<.9;L.io.visible=showL&&u>=.9;});

// ---- thao tác ----
function setTask(k){if(!ST.tk[k]){ST.tk[k]=true;save();renderRight();}}
function mark(i){ST.done[i]=true;if(ST.step===i&&i<STEPS.length-1)ST.step=i+1;ST.view=ST.step;renderLeft();renderCtrl();renderRight();}
function setView(k){Object.assign(tg,{th:VIEWS[k].th,ph:VIEWS[k].ph,r:VIEWS[k].r,tx:VIEWS[k].t[0],ty:VIEWS[k].t[1],tz:VIEWS[k].t[2]});VK=k;}
const viewFor=s=>s<=2?1:(s<=4?2:(s===5?3:0));
const EQCL=['2Li + Cl₂ →(t°) 2LiCl','2Na + Cl₂ →(t°) 2NaCl','2K + Cl₂ →(t°) 2KCl'],EQOX=['4Li + O₂ →(t°) 2Li₂O','4Na + O₂ →(t°) 2Na₂O','4K + O₂ →(t°) 2K₂O'];
const BMSG=['Li bốc cháy (ngọn lửa đỏ thẫm), mức độ yếu nhất.','Na bốc cháy mạnh hơn Li (ngọn lửa vàng cam).','K bốc cháy mạnh nhất (ngọn lửa tím nhạt).'];
function nextAct(){const i=ST.step;
 if(i===0)return{label:'Đã chuẩn bị, đeo kính bảo hộ',fn:()=>{setView(1);mark(0);}};
 if(i===1)return{label:'Cho Li, Na, K vào 3 chậu nước',fn:actWater};
 if(i===2){if(!ST.cmpd)return{label:'So sánh mức độ phản ứng',fn:actCompare};return{label:'Nhỏ phenolphthalein vào 3 chậu',fn:actPhen};}
 if(i===3){const n=ST.cl.findIndex(x=>!x);return{label:'Cho '+MNAME[n]+' vào bình Cl₂ ('+(n+1)+'/3)',fn:()=>actBurn(0,n)};}
 if(i===4){const n=ST.ox.findIndex(x=>!x);return{label:'Cho '+MNAME[n]+' vào bình O₂ ('+(n+1)+'/3)',fn:()=>actBurn(1,n)};}
 if(i===5)return{label:'Xem mô hình nguyên tử',fn:()=>{ST.mol=true;ST.rx=0;ST.rxPlay=false;mark(5);ST.view=5;setView(3);renderLeft();renderCtrl();ST.msg='Bấm “Chạy phản ứng” để xem mỗi nguyên tử nhường 1 electron.';}};
 if(i===6)return{label:'Hoàn thành thí nghiệm',fn:()=>{ST.mol=false;mark(6);setTask('g');setView(0);}};
 return null;}
function actWater(){ST.job=1;ST.eq='2M + 2H₂O → 2MOH + H₂↑   (M = Li, Na, K)';ST.msg='Cho mỗi mẫu kim loại vào một chậu thuỷ tinh chứa nước.';
 tw('mw',1,1.4,()=>{ST.msg='Quan sát chuyển động và hiện tượng của từng mẫu.';
  tw('p1',1,10,()=>{ST.msg='Li: chuyển động chậm. Na: khối cầu, chạy nhanh. K: cháy, nổ nhẹ. Cả ba sinh khí H₂.';setTask('a');ST.job=0;mark(1);});});}
function actCompare(){ST.cmpd=1;ST.cmp=1;ST.msg='Mức độ phản ứng với nước: Li < Na < K.';setTask('b');renderCtrl();}
function actPhen(){ST.job=1;ST.eq='LiOH, NaOH, KOH là base mạnh';ST.msg='Nhỏ phenolphthalein vào 3 chậu nước sau phản ứng.';
 tw('dq',1,2.4,()=>{ST.msg='Dung dịch chuyển hồng: môi trường base (LiOH, NaOH, KOH).';setTask('c');ST.job=0;mark(2);setView(2);});}
function actBurn(k,i){ST.job=1;ST.spk=k;ST.spi=i;ST.spv=1;ST.mt=1;ST.hot=0;ST.sp=0;ST.bn=0;ST.smk=0;ST.eq='';
 ST.msg='Cho mẫu '+MNAME[i]+' vào muỗng sắt.';
 tw('sp',1,1.8,()=>{ST.msg='Hơ nóng '+MNAME[i]+' trên ngọn lửa đèn cồn đến khi nóng chảy.';
  tw('fl',1,.6,null);
  tw('hot',1,2.2,()=>{ST.msg='Đưa nhanh muỗng vào bình khí '+(k===0?'chlorine':'oxygen')+'.';tw('fl',0,.6,null);
   tw('sp',2,1.5,()=>{tw('sp',3,.9,()=>{ST.eq=k===0?EQCL[i]:EQOX[i];ST.msg=BMSG[i];tw('smk',1,1.0,null);tw('mt',0,1.6+FSTR[i]*1.2,null);
     tw('bn',1,.9,()=>{tw('bn',0,1.2+1.6*FSTR[i],()=>{ST.res[k][i]=1;ST.msg=BMSG[i]+' Thu được muối/oxide màu trắng.';tw('smk',0,1.6,null);
       tw('sp',2,.9,()=>{ST.spv=0;tw('sp',0,1.6,()=>{ST.hot=0;ST.mt=1;(k===0?ST.cl:ST.ox)[i]=1;ST.job=0;
         const all=(k===0?ST.cl:ST.ox).every(x=>x);
         if(all){setTask(k===0?'d':'e');ST.msg='Cả ba kim loại đã cháy: mức độ tăng dần từ Li đến K.';mark(k===0?3:4);if(k===1)setView(0);}else renderCtrl();
       });});});});});});});});}

 c.innerHTML=b.join('');

function init3D(){
 cvs=$('cv');R=new THREE.WebGLRenderer({canvas:cvs,antialias:true});R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
 SC=new THREE.Scene();SC.background=new THREE.Color(0x0d1520);CAM=new THREE.PerspectiveCamera(40,1,.1,200);dummy=new THREE.Object3D();
 SC.add(new THREE.HemisphereLight(0xcfe4ff,0x1a2230,.95));const d1=new THREE.DirectionalLight(0xffffff,.85);d1.position.set(5,9,6);SC.add(d1);const d2=new THREE.DirectionalLight(0x9fc4ff,.35);d2.position.set(-6,4,-3);SC.add(d2);
 macro=buildMacro();mol=buildMol();mol.position.set(0,0,0);mol.visible=false;SC.add(macro);SC.add(mol);
 const pts=new Map();
 cvs.addEventListener('pointerdown',e=>{cvs.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});});
 cvs.addEventListener('pointerup',e=>pts.delete(e.pointerId));cvs.addEventListener('pointercancel',e=>pts.delete(e.pointerId));
 cvs.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;
  if(pts.size===1){const dx=e.clientX-p.x,dy=e.clientY-p.y;if(ST.mol){mol.rotation.y+=dx*.01;mol.rotation.x=clamp(mol.rotation.x+dy*.008,-1.2,1.2);}else{tg.th-=dx*.008;tg.ph=clamp(tg.ph-dy*.008,.25,1.55);}}
  else if(pts.size===2){const o=[...pts.entries()].find(([id])=>id!==e.pointerId)[1];const a0=Math.hypot(p.x-o.x,p.y-o.y),a1=Math.hypot(e.clientX-o.x,e.clientY-o.y);tg.r=clamp(tg.r*a0/Math.max(1,a1),4,26);}
  p.x=e.clientX;p.y=e.clientY;});
 cvs.addEventListener('wheel',e=>{e.preventDefault();tg.r=clamp(tg.r*(1+e.deltaY*.001),4,26);},{passive:false});
 setView(0);}
function frame(dt){
 macro.visible=!ST.mol;mol.visible=ST.mol;
 if(ST.mol)updMol(dt);else updMacro(dt);
 const L=macro.userData.labs;if(L)L.forEach(s=>{s.visible=showL&&(!s.userData.when||s.userData.when());});
 const k=1-Math.exp(-6*dt);for(const q of ['th','ph','r','tx','ty','tz'])cc[q]+=(tg[q]-cc[q])*k;
 const sp=Math.sin(cc.ph);CAM.position.set(cc.tx+cc.r*sp*Math.sin(cc.th),cc.ty+cc.r*Math.cos(cc.ph),cc.tz+cc.r*sp*Math.cos(cc.th));CAM.lookAt(cc.tx,cc.ty,cc.tz);
 const w=cvs.clientWidth,h=cvs.clientHeight;if(w&&h&&(cvs.width!==Math.floor(w*R.getPixelRatio())||cvs.height!==Math.floor(h*R.getPixelRatio()))){R.setSize(w,h,false);CAM.aspect=w/h;CAM.updateProjectionMatrix();}
 R.render(SC,CAM);}
let last=0,lastHud=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000||.016);last=now;tm+=dt;
 if(HAS3D){try{frame(dt);}catch(e){console.error(e);HAS3D=false;$('nogl').hidden=false;$('nogl').textContent='Lỗi hiển thị 3D: '+e.message;}}
 if(now-lastHud>150){lastHud=now;hud();}}
function initUI(){load();$('stu').value=ST.stu;$('stu').oninput=e=>{ST.stu=e.target.value;save();if(tab==='rs'&&$('stu2')){$('stu2').value=ST.stu;$('rtx').textContent=resText();}};
 renderLeft();renderCtrl();renderRight();
 $('stl').onclick=e=>{const s=e.target.closest('.stp');if(s)goView(+s.dataset.i);};
 document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;renderRight();};
 $('rb').onclick=e=>{const o=e.target.closest('.opt');if(o){if(o.disabled)return;QA[+o.dataset.q].sel=+o.dataset.k;save();renderRight();return;}
  const t=e.target.closest('.tfb button');if(t){if(t.disabled)return;QA[+t.dataset.q].vals[+t.dataset.j]=+t.dataset.v;renderRight();return;}
  const c=e.target.closest('.tfc');if(c&&!c.disabled)ansTF(+c.dataset.chk);};
 try{const u=JSON.parse(localStorage.getItem(UKEY)||'null');if(u)Object.assign(UI,u);}catch(e){}
 let saved=null;
 $('tl').onclick=()=>{UI.l=false;applyUI();};$('hl').onclick=()=>{UI.l=true;applyUI();};$('tgl').onclick=()=>{UI.l=!UI.l;applyUI();};
 $('tr').onclick=()=>{UI.r=false;applyUI();};$('hr').onclick=()=>{UI.r=true;applyUI();};$('tgr').onclick=()=>{UI.r=!UI.r;applyUI();};
 $('tgi').onclick=()=>{UI.i=!UI.i;if(UI.i)UI.col=false;applyUI();};$('ix').onclick=()=>{UI.i=false;applyUI();};$('ic').onclick=()=>{UI.col=!UI.col;applyUI();};
 $('tga').onclick=()=>{const any=UI.l||UI.r||UI.i;if(any){saved={l:UI.l,r:UI.r,i:UI.i};UI.l=UI.r=UI.i=false;}else{const sv=saved||{l:true,r:true,i:true};UI.l=sv.l;UI.r=sv.r;UI.i=sv.i;if(!(UI.l||UI.r||UI.i))UI.l=UI.r=UI.i=true;}applyUI();};
 addEventListener('resize',applyUI);applyUI();}
function boot(){if(booted)return;booted=true;HAS3D=(typeof THREE!=='undefined');
 if(HAS3D){try{init3D();}catch(e){console.error(e);HAS3D=false;}}
 if(!HAS3D){$('nogl').hidden=false;$('nogl').textContent='Không tải được Three.js hoặc WebGL (cần Internet). Phần bước, nhiệm vụ và câu hỏi vẫn dùng được.';}
 initUI();requestAnimationFrame(loop);}
window.addEventListener('load',()=>setTimeout(boot,50));
